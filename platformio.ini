; PlatformIO project configuration
; Elegoo ESP32 dev board (ESP32-WROOM-32, CP2102 USB-UART) + TI CC1120 dev board

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Remote unit: no serial console. Boots straight into RX and is driven only
; through the Interface API.
[env:remote]
extends = env:esp32dev
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.remote.defaults"
