<svg xmlns="http://www.w3.org/2000/svg" width="635" height="150" viewBox="0 0 635 150">
  <rect x="0" y="0" width="635" height="150" fill="#ffffff"/>

  <!-- Row fills -->
  <rect x="1" y="1" width="633" height="38" fill="#c9b8df"/>
  <rect x="1" y="39" width="633" height="52" fill="#fffca2"/>
  <rect x="1" y="91" width="633" height="58" fill="#f3aaaa"/>

  <!-- Outer border -->
  <rect x="1" y="1" width="633" height="148" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- Main dividers -->
  <line x1="111" y1="1" x2="111" y2="149" stroke="#3a3a3a" stroke-width="1.5"/>
  <line x1="1" y1="39" x2="634" y2="39" stroke="#3a3a3a" stroke-width="1.5"/>
  <line x1="1" y1="91" x2="634" y2="91" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- Driver row split: SPI driver | RF switch GPIO driver -->
  <line x1="411" y1="91" x2="411" y2="149" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- Labels: left column -->
  <text x="56" y="23" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="600" fill="#222">
    Public Interface
  </text>

  <text x="56" y="62" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#222">
    <tspan x="56" dy="0">Process</tspan>
    <tspan x="56" dy="10">Management</tspan>
  </text>

  <text x="56" y="116" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#222">
    <tspan x="56" dy="0">Hardware Device</tspan>
    <tspan x="56" dy="10">Drivers</tspan>
  </text>

  <!-- Row 1: Interface API -->
  <text x="372.5" y="18" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="600" fill="#222">
    Interface API (1U1SMGR2)
  </text>
  <text x="372.5" y="31" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#222">
    send / receive / set frequency / status
  </text>

  <!-- Row 2: Protocol Process Manager -->
  <text x="372.5" y="57" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="600" fill="#222">
    Protocol Process Manager (1U1SMGR1)
  </text>
  <text x="372.5" y="70" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#222">
    <tspan x="372.5" dy="0">CC1120 state machine: RX (default) / TX / IDLE, strobe sequencing</tspan>
    <tspan x="372.5" dy="10">Packet framing, RX queue, RF switch control, auto-retry bring-up</tspan>
  </text>

  <!-- Row 3: SPI Device Driver -->
  <text x="261" y="112" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="600" fill="#222">
    SPI Device Driver (1U1SDD1)
  </text>
  <text x="261" y="125" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#222">
    <tspan x="261" dy="0">Register / burst / strobe access to CC1120</tspan>
    <tspan x="261" dy="10">CSn, SPI mode 0, MSB first</tspan>
  </text>

  <!-- Row 3: RF switch GPIO driver -->
  <text x="522.5" y="112" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="600" fill="#222">
    RF Switch GPIO Driver
  </text>
  <text x="522.5" y="125" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#222">
    <tspan x="522.5" dy="0">GPIO 32, 3.3 V logic</tspan>
    <tspan x="522.5" dy="10">Low = RX (default), High = TX</tspan>
  </text>
</svg>
